  </defs>

  <rect width="1200" height="630" fill="url(#vsBg)"/>
  <circle cx="1060" cy="110" r="450" fill="url(#vsViolet)"/>
  <circle cx="140" cy="530" r="390" fill="url(#vsPurple)"/>

  <!-- Frame -->
  <rect x="60" y="50" width="1080" height="530" rx="32" fill="rgba(15, 12, 30, 0.75)" stroke="rgba(139, 92, 246, 0.35)" stroke-width="1.5"/>

