      <stop offset="0%" stop-color="#060713"/>
      <stop offset="50%" stop-color="#110d24"/>
      <stop offset="100%" stop-color="#05040d"/>
    </linearGradient>
    <radialGradient id="vsViolet" cx="50%" cy="50%" r="50%">
